<!DOCTYPE html>
<html>
<head>
    <title>Password Reset</title>
</head>
<body>
    <h1>Reset Password</h1>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Send Reset Email</button>
    </form>

    <p><a href="{% url 'login' %}">Back to Login</a></p>
</body>
</html>
