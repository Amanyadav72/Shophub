<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form method="POST">
    {% csrf_token %}

    {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
    {% endif %}

    {{ form.as_p }}

    <button type="submit">Login</button>

</form>

</body>
</html>
